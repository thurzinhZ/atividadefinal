spring.application.name=demo

#banco config
spring.datasource.url=jdbc:h2:mem:demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

#JPA / Hibernate config
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

#email
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

#gemini
# Preencha com sua chave real antes de usar o endpoint de Gemini
# gemini.api.key=
gemini.model=gemini-3.8-flash

app.upload-dir=./uploads
spring.servlet.multipart.enabled=true

#jwt
# chave secreta usada para assinar o token (troque por uma sua)
jwt.secret=minha-chave-secreta-do-projeto-imobiliaria-iffar-2026
# tempo de validade do token em milissegundos (3600000 = 1 hora)
jwt.expiration=3600000
