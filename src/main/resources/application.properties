spring.application.name=demo

# Banco MySQL/MariaDB do XAMPP (usuário root sem senha é o padrão do XAMPP).
# Importe database/imobiliaria.sql no phpMyAdmin antes de subir a aplicação.
# Credenciais podem ser sobrescritas pelas variáveis DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/imobiliaria}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Cria as tabelas que faltarem (não apaga dados)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql-schema.sql

#JPA / Hibernate config
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

#email
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

#gemini
# Preencha com sua chave real antes de usar o endpoint de Gemini
# gemini.api.key=
gemini.model=gemini-3.8-flash

app.upload-dir=./uploads
spring.servlet.multipart.enabled=true

#jwt
# chave secreta usada para assinar o token (troque por uma sua)
jwt.secret=minha-chave-secreta-do-projeto-imobiliaria-iffar-2026
# tempo de validade do token em milissegundos (3600000 = 1 hora)
jwt.expiration=3600000

# Aula 3: cadastra imóveis de exemplo (sem duplicar) para testar filtros e paginação
app.dados-demo=true
